<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Login{% endblock %} — Thiranex Task 4</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f172a; color: #e2e8f0; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px;
            padding: 28px; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p.sub { color: #94a3b8; margin: 0 0 20px; font-size: .95rem; }
    label { display: block; margin: 12px 0 4px; font-size: .9rem; color: #cbd5e1; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 1rem; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
      background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    a { color: #60a5fa; }
    .flash { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: .95rem; }
    .flash.error { background: #7f1d1d; color: #fecaca; }
    .flash.success { background: #14532d; color: #bbf7d0; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 6px;
      font-size: .9rem; color: #94a3b8; }
    .meter { height: 8px; background: #334155; border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .meter > div { height: 100%; width: 0; transition: width .2s; }
    .meter-label { font-size: .85rem; color: #94a3b8; margin-top: 4px; }
    .hint { font-size: .85rem; color: #94a3b8; margin-top: 14px; line-height: 1.5; }
    .qr { text-align: center; margin: 16px 0; }
    .qr img { background: #fff; padding: 8px; border-radius: 8px; max-width: 200px; }
    code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
    .logout { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
